<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khadija Elamri — Full-Stack Developer</title>
  <meta name="description" content="Full-stack developer building ERP and SaaS platforms with Python and JavaScript. Three years shipping production software.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script>
    // Applies the saved theme before the first paint, so a returning
    // dark-mode visitor never sees a white flash.
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute(
        'data-theme', saved || (prefersDark ? 'dark' : 'light')
      );
    })();
  </script>
</head>
<body>

  <!-- The header and footer live outside the router. Only <main> changes
       between pages, which is what makes navigation feel instant. -->
  <header class="site-header">
    <nav class="nav container">
      <a href="#/" class="nav-logo">Khadija Elamri</a>

      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links">
        <li><a href="#/" data-nav="home">Home</a></li>
        <li><a href="#/experience" data-nav="experience">Experience</a></li>
        <li><a href="#/projects" data-nav="projects">Projects</a></li>
        <li><a href="#/background" data-nav="background">Background</a></li>
        <li><a href="#/contact" data-nav="contact">Contact</a></li>
      </ul>

      <div class="nav-controls">
        <button class="lang-toggle" aria-label="Passer en français">FR</button>
        <button class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </nav>
  </header>

  <!-- The router renders every page into this element.
       aria-live tells screen readers that the content changed, which a
       normal page load would have announced for us. -->
  <main id="app" aria-live="polite">
    <div class="container loading-state">Loading…</div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Khadija Elamri — built from scratch with JavaScript and FastAPI.</p>
      <ul class="footer-links">
        <li><a href="https://github.com/khadijaa23">GitHub</a></li>
        <li><a href="https://linkedin.com/in/khadija-elamri">LinkedIn</a></li>
        <li><a href="mailto:amrikadija23@gmail.com">Email</a></li>
      </ul>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
