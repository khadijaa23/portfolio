<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <title id="title">Portfolio architecture</title>
  <desc id="desc">The visitor's browser loads static files from GitHub Pages. The single-page app fetches bilingual content from a read-only FastAPI service on Render, and falls back to the same JSON files served statically when the API is unreachable.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="none" stroke="#A78BFA" stroke-width="1">
    <rect x="250" y="24" width="180" height="46" rx="10"/>
    <rect x="40" y="140" width="280" height="204" rx="18"/>
    <rect x="380" y="140" width="260" height="204" rx="18"/>
  </g>

  <g fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.85">
    <rect x="62" y="206" width="236" height="54" rx="10"/>
    <rect x="62" y="276" width="236" height="54" rx="10"/>
    <rect x="402" y="206" width="216" height="54" rx="10"/>
    <rect x="402" y="276" width="216" height="54" rx="10"/>
  </g>

  <g fill="#8B86A0" font-size="12" letter-spacing="0.04em">
    <text x="340" y="52" text-anchor="middle" fill="#6D6880" font-size="13">VISITOR'S BROWSER</text>

    <text x="180" y="170" text-anchor="middle" fill="#7C3AED" font-size="13">GITHUB PAGES</text>
    <text x="180" y="190" text-anchor="middle">static · no build step</text>

    <text x="180" y="228" text-anchor="middle" fill="#6D6880" font-size="13">Single-page app</text>
    <text x="180" y="248" text-anchor="middle">hand-written hash router</text>

    <text x="180" y="298" text-anchor="middle" fill="#6D6880" font-size="13">content/en · content/fr</text>
    <text x="180" y="318" text-anchor="middle">fallback copy</text>

    <text x="510" y="170" text-anchor="middle" fill="#7C3AED" font-size="13">RENDER</text>
    <text x="510" y="190" text-anchor="middle">Python · FastAPI</text>

    <text x="510" y="228" text-anchor="middle" fill="#6D6880" font-size="13">Read-only REST API</text>
    <text x="510" y="248" text-anchor="middle">7 endpoints · OpenAPI docs</text>

    <text x="510" y="298" text-anchor="middle" fill="#6D6880" font-size="13">content/en · content/fr</text>
    <text x="510" y="318" text-anchor="middle">source of truth</text>
  </g>

  <g stroke="#A78BFA" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <path d="M340 70 V104 H180 V136"/>
    <path d="M298 233 H376"/>
    <path d="M510 272 V262"/>
  </g>

  <path d="M150 262 V272" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#a)" opacity="0.7"/>

  <text x="340" y="376" text-anchor="middle" fill="#8B86A0" font-size="11" letter-spacing="0.04em">
    solid: content from the API — dashed: local fallback when it is unreachable
  </text>
</svg>
